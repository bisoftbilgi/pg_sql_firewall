[package]
name = "sql_firewall"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_sql_firewall"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = []
# Test-only shared-memory hold and read adapter. Not part of the release build.
queue_probe = []
# Test-only SQL access to the production fingerprint normalizer. Not part of
# the release build.
fingerprint_probe = []
# Test-only hold point between a policy read and its cache publication, and
# cache inspection. Not part of the release build.
policy_probe = []
# Test-only: a 16-entry rate-limit table and a background worker that runs
# one statement as a role, standing in for pg_cron-style job runners. Not
# part of the release build.
session_probe = []

[dependencies]
pgrx = "=0.16.1"
libc = "0.2"
sha2 = "=0.10.9"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
pgrx-tests = "=0.16.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
